[global]
; Optimisations PHP-FPM pour une API haute performance

; Gestion des erreurs et logs
error_log = /proc/self/fd/2
log_level = warning

[www]
; Configuration du pool principal

; Utilisateur et groupe
user = www-data
group = www-data

; Type de connexion avec le serveur web
listen = 9000

; Gestion des processus - Configuration dynamique optimisée
pm = dynamic
pm.max_children = 50          ; Nombre maximum de processus enfants
pm.start_servers = 10         ; Nombre de processus au démarrage
pm.min_spare_servers = 5      ; Minimum de processus en attente
pm.max_spare_servers = 20     ; Maximum de processus en attente
pm.max_requests = 1000        ; Recyclage après 1000 requêtes (évite les fuites mémoire)

; Timeouts
request_terminate_timeout = 30s
request_slowlog_timeout = 10s

; Monitoring et status
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; Logs d'accès et slow log
access.log = /proc/self/fd/2
slowlog = /proc/self/fd/2

; Catch workers output
catch_workers_output = yes
decorate_workers_output = no

; Limite les logs en production
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
